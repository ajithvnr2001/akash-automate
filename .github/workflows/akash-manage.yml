name: Akash Management Workflow

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - deploy
          - destroy
      akash_api_key:
        description: 'Custom Akash API Key (leave empty to use repository secret AKASH_API_KEY)'
        required: false
        default: ''
      app_api_keys:
        description: 'App/AI API Keys to inject into container (KEY=VALUE per line, e.g. ANTHROPIC_API_KEY=sk-...)'
        required: false
        default: ''
      cpu:
        description: 'CPU cores (deploy only)'
        required: false
        default: '4'
      memory:
        description: 'Memory allocation (deploy only)'
        required: false
        default: '16Gi'
      storage:
        description: 'Disk storage (deploy only)'
        required: false
        default: '250Gi'
      runtime_hours:
        description: 'Runtime limit in hours (deploy only)'
        required: false
        default: '24'

jobs:
  manage:
    name: Execute Akash Operation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Akash API Key
        id: auth
        env:
          INPUT_KEY: ${{ github.event.inputs.akash_api_key }}
          SECRET_KEY: ${{ secrets.AKASH_API_KEY }}
        run: |
          if [ -n "$INPUT_KEY" ]; then
            echo "Using Akash API key passed via workflow input."
            echo "KEY=$INPUT_KEY" >> $GITHUB_OUTPUT
          elif [ -n "$SECRET_KEY" ]; then
            echo "Using Akash API key from repository secret AKASH_API_KEY."
            echo "KEY=$SECRET_KEY" >> $GITHUB_OUTPUT
          else
            echo "ERROR: No Akash API key provided in input or repository secrets!"
            exit 1
          fi

      - name: Setup App API Keys (.env)
        env:
          APP_KEYS: ${{ github.event.inputs.app_api_keys }}
        run: |
          if [ -n "$APP_KEYS" ]; then
            echo "Writing application API keys to .env..."
            printf "%s\n" "$APP_KEYS" > .env
            echo "Created .env with $(wc -l < .env) line(s)"
          fi

      - name: Run Akash Action (${{ github.event.inputs.action }})
        shell: pwsh
        env:
          AKASH_API_KEY: ${{ steps.auth.outputs.KEY }}
        run: |
          $action = "${{ github.event.inputs.action }}"
          Write-Host "Executing action: $action"

          switch ($action) {
              'status' {
                  & ./status.ps1
              }
              'deploy' {
                  $cpu = [double]"${{ github.event.inputs.cpu }}"
                  $mem = "${{ github.event.inputs.memory }}"
                  $storage = "${{ github.event.inputs.storage }}"
                  $hours = [int]"${{ github.event.inputs.runtime_hours }}"
                  $deployParams = @{
                      Cpu               = $cpu
                      Memory            = $mem
                      Storage           = $storage
                      RuntimeLimitHours = $hours
                  }
                  if (Test-Path ".env") {
                      $deployParams['EnvFile'] = ".env"
                  }
                  & ./deploy.ps1 @deployParams
              }
              'destroy' {
                  & ./destroy.ps1
              }
              default {
                  Write-Error "Unknown action: $action"
                  exit 1
              }
          }
